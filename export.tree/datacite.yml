This dataset contains de-identified resting-state EEG recordings (rest), working-memory EEG and behavioural data (workingmemory), TMS-EEG recordings (tmseeg) from four stimulation sites including prefrontal cortex, premotor cortex, parietal cortex, and shoulder as a control condition, as well as behavioural data from a multi-task cognitive battery comprising the bar (bar), backwards digit span (bds), colour (clt), go/no-go (gng), n-back (nback), operation span (opn), orientation (ort), symbol search (sbs), stop-signal (sst), and symmetry span (sym) tasks. Structural MRI data were collected as part of the broader study but are not included in this OpenNeuro release.


## Responsible Data Use

The dataset contains de-identified human-participant data. Users should not attempt to identify, re-identify, or contact participants and should cite the dataset DOI and associated publication in any resulting work.
